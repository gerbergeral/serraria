<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Comercial — Gerber Serraria</title>
<style>
:root {
  --bg: #f4f6f9; --card: #ffffff; --ink: #111827; --ink2: #374151; --muted: #6b7280; --line: #e5e7eb; --soft: #f9fafb;
  --brand: #111111; --accent: #1f4e79; --accent-soft: #eaf1f8;
  --green: #16a34a; --green-soft: #ecfdf3; --amber: #d97706; --amber-soft: #fff7e6; --red: #dc2626; --red-soft: #fef2f2; --blue: #2563eb; --blue-soft: #eff6ff;
  --radius: 14px; --shadow: 0 1px 3px rgba(17,24,39,.06), 0 6px 18px rgba(17,24,39,.05);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.45; }

/* HEADER */
.header { background: #fff; border-bottom: 1px solid var(--line); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 18px; }
.brand img { height: 46px; width: auto; display: block; }
.brand .unit { border-left: 2px solid var(--line); padding-left: 18px; }
.brand .unit h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: .3px; }
.brand .unit span { font-size: .8rem; color: var(--muted); }
.header-info { text-align: right; font-size: .82rem; color: var(--muted); }
.header-info strong { color: var(--ink); }

/* NAV */
.nav { background: #fff; border-bottom: 1px solid var(--line); display: flex; gap: 4px; padding: 8px 16px; overflow-x: auto; position: sticky; top: 0; z-index: 50; }
.nav button { border: none; background: transparent; padding: 10px 14px; border-radius: 10px; font-size: .86rem; font-weight: 600; color: var(--ink2); cursor: pointer; white-space: nowrap; transition: background .15s; }
.nav button:hover { background: var(--soft); }
.nav button.active { background: var(--brand); color: #fff; }
.nav button .lock { font-size: .72rem; opacity: .7; margin-left: 2px; }

/* LAYOUT */
.main { max-width: 1180px; margin: 0 auto; padding: 18px 20px 40px; }
.tab { display: none; } .tab.active { display: block; }
.bar { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.bar label { font-weight: 700; font-size: .88rem; }
.bar select { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: .9rem; background: #fff; }
.bar .status { font-size: .8rem; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: .75rem; font-weight: 700; }
.chip.green { background: var(--green-soft); color: var(--green); } .chip.amber { background: var(--amber-soft); color: var(--amber); }
.chip.red { background: var(--red-soft); color: var(--red); } .chip.blue { background: var(--blue-soft); color: var(--blue); } .chip.gray { background: var(--soft); color: var(--muted); border: 1px solid var(--line); }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.grid-2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; min-width: 0; }
.card h2 { font-size: 1.05rem; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card .sub { font-size: .82rem; color: var(--muted); margin-bottom: 14px; }
.kpi { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.kpi .l { font-size: .72rem; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 700; }
.kpi .v { font-size: 1.5rem; font-weight: 800; margin-top: 2px; }
.kpi .h { font-size: .78rem; color: var(--muted); margin-top: 2px; }
.big { font-size: 2.4rem; font-weight: 900; letter-spacing: -.5px; line-height: 1.1; }
.ok { color: var(--green); } .warn { color: var(--amber); } .bad { color: var(--red); } .info { color: var(--blue); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: .88rem; }
.row:last-child { border-bottom: none; }
.row .lbl { color: var(--ink2); }
.row .val { font-weight: 700; white-space: nowrap; }

/* PROGRESS */
.prog { position: relative; height: 14px; background: #eef0f3; border-radius: 999px; overflow: hidden; margin: 10px 0 4px; }
.prog .fill { height: 100%; border-radius: 999px; transition: width .6s ease; }
.fill.green { background: linear-gradient(90deg,#22c55e,#16a34a); } .fill.amber { background: linear-gradient(90deg,#fbbf24,#d97706); }
.fill.red { background: linear-gradient(90deg,#f87171,#dc2626); } .fill.blue { background: linear-gradient(90deg,#60a5fa,#2563eb); } .fill.dark { background: #111827; }
.marks { position: relative; height: 22px; font-size: .7rem; color: var(--muted); font-weight: 700; }
.marks span { position: absolute; transform: translateX(-100%); white-space: nowrap; }
.marks em { font-style: normal; }
@media (max-width: 600px) { .marks em { display: none; } }
.marks span::before { content: ''; position: absolute; right: 0; top: -6px; width: 2px; height: 6px; background: #9ca3af; }
.mini { height: 8px; }

/* META BADGES */
.metas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.meta { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; }
.meta.hit { border-color: var(--green); background: var(--green-soft); }
.meta .t { font-size: .74rem; font-weight: 800; text-transform: uppercase; color: var(--muted); }
.meta.hit .t { color: var(--green); }
.meta .v { font-size: 1.05rem; font-weight: 800; }
.meta .b { font-size: .75rem; color: var(--muted); }

/* RANKING */
.rank { display: flex; flex-direction: column; gap: 8px; }
.rank-item { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.rank-item.first { border-color: #f5c451; background: #fffbeb; }
.rank-item .pos { font-size: 1.4rem; text-align: center; }
.rank-item .nm { font-weight: 700; }
.rank-item .sm { font-size: .78rem; color: var(--muted); }
.rank-item .rv { text-align: right; font-weight: 800; }

/* PERSON */
.person { border-top: 4px solid var(--accent); }
.person .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.person .nome { font-weight: 800; font-size: 1.02rem; }
.tip { background: var(--accent-soft); border: 1px solid #d6e4f2; color: #173b5c; border-radius: 12px; padding: 12px 14px; font-size: .88rem; margin-bottom: 16px; }
.tip strong { display: block; margin-bottom: 2px; }
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: stretch; }
.flow .step { border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; background: #fff; }
.flow .step .n { font-size: 1.6rem; font-weight: 900; }
.flow .step .l { font-size: .74rem; color: var(--muted); font-weight: 700; text-transform: uppercase; }
.policy { font-size: .85rem; color: var(--ink2); }
.policy li { margin: 4px 0 4px 18px; }
details.pol { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: #fff; margin-bottom: 16px; }
details.pol summary { cursor: pointer; font-weight: 700; font-size: .9rem; }
details.pol[open] summary { margin-bottom: 8px; }

/* TABLES */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .85rem; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { background: var(--soft); font-size: .72rem; text-transform: uppercase; color: var(--muted); letter-spacing: .3px; }
.fill-table td:first-child { font-weight: 700; }
.fill-table input { width: 100%; min-width: 70px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; font-size: .9rem; text-align: center; }
.fill-table input.money { min-width: 110px; text-align: right; }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-bottom: 8px; }
.field label { display: block; font-size: .8rem; font-weight: 700; margin-bottom: 4px; color: var(--ink2); }
.field input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: .92rem; }
input:focus, select:focus { outline: 2px solid #93c5fd; outline-offset: 1px; }
.section-title { font-size: .95rem; font-weight: 800; margin: 18px 0 8px; }
.btn { border: none; border-radius: 10px; padding: 11px 20px; font-weight: 800; font-size: .88rem; cursor: pointer; }
.btn-dark { background: var(--brand); color: #fff; } .btn-dark:hover { background: #333; }
.btn-light { background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: .6; cursor: wait; }
.alert { padding: 10px 14px; border-radius: 10px; font-size: .86rem; margin: 10px 0; }
.alert.green { background: var(--green-soft); color: #14532d; border: 1px solid #bbf7d0; }
.alert.red { background: var(--red-soft); color: #7f1d1d; border: 1px solid #fecaca; }
.alert.amber { background: var(--amber-soft); color: #7c2d12; border: 1px solid #fde68a; }
.alert.blue { background: var(--blue-soft); color: #1e3a8a; border: 1px solid #bfdbfe; }
.empty { text-align: center; color: var(--muted); padding: 22px; font-size: .9rem; }
.spinner { width: 30px; height: 30px; border: 3px solid #e5e7eb; border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; margin: 18px auto; }
@keyframes spin { to { transform: rotate(360deg); } }

/* LOGIN */
.overlay { display: none; position: fixed; inset: 0; background: rgba(17,24,39,.45); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
.overlay.show { display: flex; }
.login { background: #fff; border-radius: 16px; padding: 26px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,.18); }
.login img { height: 34px; margin-bottom: 12px; }
.login h3 { margin-bottom: 4px; }
.login p { font-size: .84rem; color: var(--muted); margin-bottom: 14px; }
.login input { width: 100%; padding: 11px; border: 1px solid var(--line); border-radius: 10px; font-size: 1rem; margin-bottom: 10px; text-align: center; }
.login .err { color: var(--red); font-size: .82rem; min-height: 18px; margin-top: 6px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 18px; border-radius: 14px; width: max-content; font-weight: 700; font-size: .85rem; z-index: 200; display: none; max-width: 92vw; text-align: center; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 150; }

@media (max-width: 720px) {
  .header { padding: 12px 14px; }
  .brand img { height: 36px; } .brand .unit { padding-left: 12px; } .brand .unit h1 { font-size: 1.05rem; }
  .header-info { text-align: left; }
  .main { padding: 12px 12px 30px; }
  .metas { grid-template-columns: 1fr; }
  .big { font-size: 2rem; }
  .card { padding: 14px; }
}
</style>
</head>

function atrasoChip(r) { const n = atrasoDias(r); if (n == null || n <= 0) return ''; return ` <span class="chip ${n >= 2 ? 'amber' : 'gray'}">+${n} dia${n > 1 ? 's' : ''}</span>`; }
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function num(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v == null ? '' : v).trim().replace(/[R$\s]/g, '');
  if (!s) return 0;
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  else if ((s.match(/\./g) || []).length > 1 || /^-?\d{1,3}\.\d{3}$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s); return isFinite(n) ? n : 0;
}
const fmt = v => Math.round(Number(v) || 0).toLocaleString('pt-BR');
const fmt2 = v => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = v => (Number(v) || 0).toFixed(1).replace('.', ',');
const brl = v => 'R$ ' + fmt(v);
const rotulo = m => { const p = m.split('/'); return MESES[ABREV.indexOf(p[0])] + ' ' + p[1]; };
const mesKey = m => { const p = m.split('/'); return parseInt(p[1], 10) * 100 + ABREV.indexOf(p[0]) + 1; };
const mesHoje = () => { const d = new Date(); return ABREV[d.getMonth()] + '/' + d.getFullYear(); };
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parseData = s => { const p = String(s || '').split('/'); return p.length === 3 ? new Date(+p[2], +p[1] - 1, +p[0]) : null; };
const isFeriado = d => { const l = FERIADOS[d.getFullYear()]; return l ? l.includes(iso(d)) : FIXOS_ANO.includes(iso(d).slice(5)); };
const isUtil = d => d.getDay() !== 0 && d.getDay() !== 6 && !isFeriado(d);
function contarUteis(de, ate) { let c = 0; const d = new Date(de.getFullYear(), de.getMonth(), de.getDate()); while (d <= ate) { if (isUtil(d)) c++; d.setDate(d.getDate() + 1); } return c; }
const corSlot = k => CORES[(k - 1) % CORES.length];
function toast(msg, bg) { const t = $('toast'); t.textContent = msg; t.style.background = bg || '#111827'; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500); }
const bar = (p, cls, extra) => `<div class="prog ${extra || ''}"><div class="fill ${cls}" style="width:${Math.max(0, Math.min(p, 100))}%"></div></div>`;
const kpi = (l, v, h, cls) => `<div class="kpi"><div class="l">${l}</div><div class="v ${cls || ''}">${v}</div>${h ? `<div class="h">${h}</div>` : ''}</div>`;

// ==================== API ====================
async function apiGet(params) {
  const r = await fetch(SHEET_URL + '?' + new URLSearchParams(params) + '&_=' + Date.now());
  if (!r.ok) throw new Error('HTTP ' + r.status); return r.json();
}
async function apiPost(body) {
  const r = await fetch(SHEET_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('HTTP ' + r.status); return r.json();
}

// ==================== NAVEGAÇÃO E ACESSO ====================
const RESTRITAS = ['lider', 'preencher'];
document.querySelectorAll('#nav button').forEach(b => b.addEventListener('click', () => {
  const tab = b.dataset.tab;
  if (RESTRITAS.includes(tab) && cfg && cfg.consulta) { toast('🔒 ' + rotulo(currentMonth) + ' está fechado (só consulta até ' + cfg.consultaAte + ').', '#b45309'); return; }
  if (RESTRITAS.includes(tab) && !isUnlocked) { pendingTab = tab; showLogin(); return; }
  switchTab(tab);
}));
function switchTab(tab) {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === 'tab-' + tab));
  if (tab === 'lider') renderLider();
  if (tab === 'preencher') renderPreencher();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function showLogin() { $('loginTarget').textContent = 'Senha de ' + rotulo(currentMonth); $('loginMsg').textContent = ''; $('loginOverlay').classList.add('show'); setTimeout(() => $('loginPass').focus(), 50); }
function closeLogin() { $('loginOverlay').classList.remove('show'); $('loginPass').value = ''; pendingTab = ''; }
async function checkLogin() {
  const senha = $('loginPass').value.trim();
  if (!senha) { $('loginMsg').textContent = 'Digite a senha.'; return; }
  const b = $('btnLogin'); b.disabled = true; b.textContent = 'Verificando...';
  try {
    const r = await apiPost({ action: 'login', mes: currentMonth, senha });
    if (r && r.ok) { senhaLider = senha; setUnlocked(true); const t = pendingTab || 'preencher'; closeLogin(); switchTab(t); }
    else $('loginMsg').textContent = (r && r.msg) || 'Senha incorreta.';
  } catch (e) { $('loginMsg').textContent = 'Sem conexão com a planilha.'; }

}
function setUnlocked(on) {
  isUnlocked = on;
  $('liderOn').style.display = on ? 'inline-flex' : 'none';
  $('btnSair').style.display = on ? 'inline-block' : 'none';
  document.querySelectorAll('#nav .lock').forEach(l => l.textContent = on ? '' : '🔒');
  if (!on) {
    senhaLider = null; $('liderContent').innerHTML = ''; $('preencherContent').innerHTML = '';
    const a = document.querySelector('#nav button.active'); if (a && RESTRITAS.includes(a.dataset.tab)) switchTab('meta');
  }
}
function logout() { setUnlocked(false); toast('Área da líder fechada'); }

// ==================== CARREGAMENTO ====================
async function init() {
  const now = new Date(), fim = new Date(now.getFullYear(), now.getMonth() + 1, 0), h = now.getHours();
  $('headerInfo').innerHTML = `<div><strong>${h < 12 ? '☀️ Bom dia' : h < 18 ? '🌤️ Boa tarde' : '🌙 Boa noite'}, equipe!</strong></div><div>${now.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' })}</div><div>${contarUteis(now, fim)} dias úteis até o fim do mês (contando hoje)</div>`;
  try {
    const meses = await apiGet({ action: 'meses' });
    const itens = (Array.isArray(meses) ? meses : []).map(x => typeof x === 'string' ? { mes: x } : x).filter(x => x && x.mes).sort((a, b) => mesKey(a.mes) - mesKey(b.mes));
    const lista = itens.map(x => x.mes);
    itens.forEach(x => { const o = document.createElement('option'); o.value = x.mes; o.textContent = rotulo(x.mes) + (x.consulta ? ' · fechado (consulta)' : ''); $('monthSelect').appendChild(o); });
    if (!lista.length) { $('monthStatus').textContent = 'Nenhum mês aberto'; $('metaContent').innerHTML = '<div class="alert amber">Nenhum mês está ABERTO. A gestão abre o mês na aba CONFIG da planilha.</div>'; return; }
    const abertos = itens.filter(x => !x.consulta).map(x => x.mes);
    $('monthSelect').value = lista.includes(mesHoje()) ? mesHoje() : (abertos.length ? abertos[abertos.length - 1] : lista[lista.length - 1]);
    await loadMonth();
  } catch (e) { console.error(e); $('monthStatus').textContent = 'Erro ao conectar'; $('metaContent').innerHTML = '<div class="alert red">Não foi possível conectar com a planilha.</div>'; }
}
function slotsDe(c, ult) {
  let out = [];
  if (c && Array.isArray(c.consultoras)) out = c.consultoras.filter(x => x && x.nome).map(x => ({ k: x.k, nome: x.nome }));
  if (!out.length && ult) for (let k = 1; k <= 6; k++) if (ult['c' + k + '_nome']) out.push({ k, nome: String(ult['c' + k + '_nome']) });
  if (!out.length) out = NOMES_PADRAO.map((n, i) => ({ k: i + 1, nome: n }));
  return out;
}
async function loadMonth() {
  const anterior = currentMonth;
  currentMonth = $('monthSelect').value || currentMonth;
  $('monthStatus').textContent = 'Carregando...';
  try {
    const [c, regs] = await Promise.all([apiGet({ action: 'config', mes: currentMonth }), apiGet({ action: 'carregar', mes: currentMonth })]);
    if (!Array.isArray(regs)) throw new Error((regs && regs.msg) || 'mês indisponível');
    cfg = c && c.ok ? c : null; records = regs; SLOTS = slotsDe(cfg, records[0]);
    const r0 = records[0];
    $('monthStatus').innerHTML = (cfg && cfg.consulta ? `<span class="chip amber">🔒 Mês fechado · consulta até ${esc(cfg.consultaAte)}</span> ` : '') + esc(r0 ? `Dados até ${r0.data || '—'} · lançado por ${r0.nome || '—'}${lancTxt(r0) ? ' em ' + lancTxt(r0) : ''}` : 'Nenhuma apuração neste mês ainda');
    document.querySelectorAll('#nav .lock').forEach(l => { if (cfg && cfg.consulta) l.textContent = '🔒'; });
    if (isUnlocked && cfg && cfg.consulta) setUnlocked(false);
    else if (isUnlocked && anterior && anterior !== currentMonth) {   // senha é por mês
      const r = await apiPost({ action: 'login', mes: currentMonth, senha: senhaLider }).catch(() => null);
      if (!r || !r.ok) { setUnlocked(false); toast('A senha de ' + rotulo(currentMonth) + ' é diferente. Entre novamente.', '#dc2626'); }
    }
    renderAll();
    const a = document.querySelector('#nav button.active');
    if (a && isUnlocked && RESTRITAS.includes(a.dataset.tab)) switchTab(a.dataset.tab);
  } catch (e) { console.error(e); records = []; $('monthStatus').textContent = 'Erro ao carregar: ' + e.message; renderAll(); }
}

// ==================== CÁLCULOS ====================
function metas() {
  if (cfg && cfg.meta1) return [cfg.meta1, cfg.meta2 || Math.round(cfg.meta1 * 1.1), cfg.super || Math.round(cfg.meta1 * 1.2)];
  return METAS_PADRAO;
}
function getTotals() {
  const L = records[0] || {};
  const pessoas = SLOTS.map(c => {
    const p = 'c' + c.k + '_', novas = num(L[p + 'novas']), remat = num(L[p + 'remat']), vendas = novas + remat, anuais = num(L[p + 'p']);
    return { k: c.k, nome: c.nome, cor: corSlot(c.k), v: num(L[p + 'v']), novas, remat, vendas, anuais, aval: num(L[p + 'aval']), prod: num(L[p + 'prod']) };
  });
  const o = { v: num(L.ov), novas: num(L.o_novas), remat: num(L.o_remat), anuais: num(L.op), aval: num(L.o_aval), prod: num(L.ou_prod) };
  o.vendas = o.novas + o.remat;
  const t = {
    pessoas, outros: o,
    totalEquipe: pessoas.reduce((s, p) => s + p.v, 0),
    vendasEquipe: pessoas.reduce((s, p) => s + p.vendas, 0),
    anuaisEquipe: pessoas.reduce((s, p) => s + p.anuais, 0),
    renovTotal: num(L.renovTotal), renovFeitos: num(L.renovFeitos), renovAnuais: num(L.renovAnuais), ini: num(L.ativos_inicio), canc: num(L.cancelamentos),
    dataUlt: parseData(L.data)
  };
  t.totalMes = t.totalEquipe + o.v;
  t.totalVendas = t.vendasEquipe + o.vendas;
  t.totalAnuais = t.anuaisEquipe + o.anuais;
  // Qualidade da venda: anuais (novos + rematrículas + renovações) ÷ tudo o que foi vendido/renovado
  t.qualBase = t.totalVendas + t.renovFeitos;
  t.qualAnuais = t.totalAnuais + Math.min(t.renovAnuais, t.renovFeitos);
  t.qualPct = t.qualBase ? t.qualAnuais / t.qualBase * 100 : null;
  t.totalProdutos = pessoas.reduce((s, p) => s + p.prod, 0) + o.prod;
  t.naoRenovados = Math.max(t.renovTotal - t.renovFeitos, 0);
  t.saidas = t.naoRenovados + t.canc;
  t.atual = t.ini - t.saidas + t.totalVendas;
  t.taxaRenov = t.renovTotal > 0 ? t.renovFeitos / t.renovTotal * 100 : null;
  t.taxaCanc = t.ini > 0 ? t.canc / t.ini * 100 : null;
  return t;
}
// R$100 a cada 15 completas; sobra de 10 a 14 acima de um bloco = R$5 por venda; abaixo de 15 = 0
function bonusVendas(v) {
  if (v < POL.bloco) return 0;
  const sobra = v % POL.bloco;
  return Math.floor(v / POL.bloco) * POL.valorBloco + (sobra >= POL.excMin ? sobra * POL.valorExc : 0);
}
function proximoBonus(v) {
  if (v < POL.bloco) return { faltam: POL.bloco - v, txt: `faltam ${POL.bloco - v} para liberar o 1º bônus de R$ 100` };
  const sobra = v % POL.bloco;
  if (sobra < POL.excMin) return { faltam: POL.excMin - sobra, txt: `faltam ${POL.excMin - sobra} para liberar o excedente (R$ 5 por venda)` };
  return { faltam: POL.bloco - sobra, txt: `faltam ${POL.bloco - sobra} para fechar mais um bloco de 15` };
}
const faixa = total => { const [m1, m2, m3] = metas(); return total >= m3 ? 3 : total >= m2 ? 2 : total >= m1 ? 1 : 0; };
// Rateio: participação de cada consultora no TOTAL COLETIVO (inclui Outros). A fatia de Outros não é paga a ninguém.
function bonusMeta(v, t) { const f = faixa(t.totalMes); return f && t.totalMes > 0 ? v / t.totalMes * POL.bonusMeta[f - 1] : 0; }
const bonusRenov = t => t.taxaRenov == null ? 0 : t.taxaRenov >= 85 ? POL.renov85 : t.taxaRenov >= 70 ? POL.renov70 : 0;
function calendario(t) {
  const p = currentMonth.split('/'), idx = ABREV.indexOf(p[0]), ano = +p[1];
  const ini = new Date(ano, idx, 1), fim = new Date(ano, idx + 1, 0), hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const dif = mesKey(currentMonth) - mesKey(mesHoje());
  const restantes = dif < 0 ? 0 : contarUteis(dif === 0 ? hoje : ini, fim);
  const totais = contarUteis(ini, fim);
  // ritmo: dias úteis já cobertos pela última apuração
  const base = t.dataUlt && t.dataUlt >= ini ? t.dataUlt : null;
  const decorridos = base ? contarUteis(ini, base) : 0;
  const depois = base ? (() => { const d = new Date(base); d.setDate(d.getDate() + 1); return contarUteis(d, fim); })() : totais;
  const ritmo = decorridos > 0 ? t.totalMes / decorridos : 0;
  return { restantes, totais, decorridos, ritmo, projecao: t.totalMes + ritmo * depois, encerrado: dif < 0 };
}

// ==================== RENDER ====================
function renderAll() {
  const t = getTotals();
  renderMeta(t); renderAtivos(t); renderRetencao(t); renderFolha(t); renderProdutos(t);
}

// ---------- 1. META FINANCEIRA ----------
function renderMeta(t) {
  const [m1, m2, m3] = metas(), total = t.totalMes, f = faixa(total);
  const cal = calendario(t);
  if (f >= 1 && !confettiShown[currentMonth]) { confettiShown[currentMonth] = true; confetti(); }
  const corTotal = f >= 1 ? 'ok' : total >= m1 * .7 ? 'warn' : 'bad';
  const prox = [m1, m2, m3][Math.min(f, 2)], falta = Math.max(prox - total, 0);
  let status;
  if (total === 0) status = '<span class="chip gray">📋 Aguardando a primeira apuração do mês</span>';
  else if (f === 3) status = '<span class="chip green">🏆 SUPER META ATINGIDA! Equipe incrível!</span>';
  else status = `<span class="chip ${f ? 'green' : 'amber'}">${f ? '✅ Meta ' + f + ' atingida · ' : ''}Faltam ${brl(falta)} para a Meta ${f + 1}</span>`;
  const n = Math.max(SLOTS.length, 1);
  const linhaDia = (nome, alvo) => {
    const saldo = Math.max(alvo - total, 0), dia = cal.restantes > 0 ? saldo / cal.restantes : 0;
    if (saldo <= 0) return `<tr><td><strong>${nome}</strong> · ${brl(alvo)}</td><td colspan="3"><span class="chip green">✅ Atingida</span></td></tr>`;
    return `<tr><td><strong>${nome}</strong> · ${brl(alvo)}</td><td>${brl(saldo)}</td><td><strong>${cal.restantes ? brl(dia) : '—'}</strong></td><td><strong class="info">${cal.restantes ? brl(dia / n) : '—'}</strong></td></tr>`;
  };
  const rank = t.pessoas.map(p => ({ ...p })).sort((a, b) => b.v - a.v);
  const medal = ['🥇', '🥈', '🥉'];
  const proj = cal.projecao, fProj = faixa(proj);

  // dica do dia
  let dica;
  if (total === 0) dica = 'Assim que a líder lançar a primeira apuração, o painel mostra quanto cada uma precisa vender por dia.';
  else if (f === 3) dica = 'Super meta batida! Agora o foco é qualidade: plano anual e renovação para começar o próximo mês com a base forte.';
  else if (cal.encerrado) dica = 'Mês encerrado para vendas. Use estes números como base para planejar o próximo mês.';
  else if (cal.decorridos && fProj > f) dica = `No ritmo atual (${brl(cal.ritmo)} por dia útil) o mês fecha em ${brl(proj)} e bate a Meta ${fProj}. Mantenham o ritmo!`;
  else if (cal.decorridos) dica = `No ritmo atual (${brl(cal.ritmo)} por dia útil) o mês fecha em ${brl(proj)}, abaixo da Meta ${f + 1}. Cada uma precisa de ${brl(cal.restantes ? falta / cal.restantes / n : 0)} por dia. ${Math.ceil(falta / POL.planoAnualValor)} plano(s) anual(is) cobrem o que falta.`;
  else dica = `Faltam ${brl(falta)}. Planos anuais aceleram a meta: ${Math.ceil(falta / POL.planoAnualValor)} anual(is) cobrem o que falta.`;

  $('metaContent').innerHTML = `
    <div class="card">
      <h2>🎯 Resultado coletivo — ${esc(rotulo(currentMonth))}</h2>
      <div class="sub">Soma de tudo o que a unidade vendeu no mês (consultoras + outros).</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap">
        <div><div class="big ${corTotal}">${brl(total)}</div><div style="font-size:.85rem;color:var(--muted)">${pct(m1 ? total / m1 * 100 : 0)}% da Meta 1</div></div>
        <div>${status}</div>
      </div>
      ${bar(m3 ? total / m3 * 100 : 0, f >= 1 ? 'green' : total >= m1 * .7 ? 'amber' : 'red')}
      <div class="marks"><span style="left:${m1 / m3 * 100}%">M<em>eta </em>1</span><span style="left:${m2 / m3 * 100}%">M<em>eta </em>2</span><span style="left:100%">M<em>eta </em>3</span></div>
      <div class="metas">
        ${[[m1, 1], [m2, 2], [m3, 3]].map(([v, i]) => `<div class="meta ${total >= v ? 'hit' : ''}"><div class="t">${total >= v ? '✅ ' : ''}Meta ${i}${i === 3 ? ' · Super' : ''}</div><div class="v">${brl(v)}</div><div class="b">Bônus da equipe: ${brl(POL.bonusMeta[i - 1])}</div></div>`).join('')}
      </div>
      <div style="margin-top:12px;font-size:.82rem;color:var(--muted)">📅 <strong style="color:var(--text)">Qualidade da venda:</strong> ${t.qualPct == null ? 'aparece após a primeira apuração' : `<strong style="color:var(--text)">${pct(t.qualPct)}% anuais</strong> · ${t.qualAnuais} de ${t.qualBase} planos (novos + rematrículas + renovações) · ${t.totalAnuais} em vendas e ${Math.min(t.renovAnuais, t.renovFeitos)} em renovações`}</div>
    </div>

    <div class="tip"><strong>💡 Dica do dia</strong>${esc(dica)}</div>

    <div class="grid-2">
      <div class="card">
        <h2>📆 Quanto precisamos por dia</h2>
        <div class="sub">O que falta para cada meta dividido pelos <strong>${cal.restantes} dias úteis</strong> restantes (sem sábados, domingos e feriados) e pelas ${n} consultoras.</div>
        <div class="table-wrap"><table>
          <tr><th>Meta</th><th>Falta</th><th>Equipe / dia</th><th>Cada vendedora / dia</th></tr>
          ${linhaDia('Meta 1', m1)}${linhaDia('Meta 2', m2)}${linhaDia('Meta 3', m3)}
        </table></div>
      </div>
      <div class="card">
        <h2>🚀 Ritmo do mês</h2>
        <div class="sub">Com base na última apuração.</div>
        <div class="grid" style="grid-template-columns:repeat(2,1fr)">
          ${kpi('Dias úteis', `${cal.decorridos}/${cal.totais}`, 'já trabalhados / total')}
          ${kpi('Média por dia útil', brl(cal.ritmo), 'ritmo atual da equipe')}
          ${kpi('Projeção do mês', brl(proj), fProj ? 'bate a Meta ' + fProj : 'abaixo da Meta 1', fProj ? 'ok' : 'bad')}
          ${kpi('Dias restantes', cal.restantes, 'dias úteis')}
        </div>
      </div>
    </div>

    <div class="card">
      <h2>🏆 Ranking — Top vendedora do mês</h2>
      <div class="sub">Por valor vendido. A participação de cada uma define a fatia do bônus da meta.</div>
      ${total === 0 ? '<div class="empty">O ranking aparece após a primeira apuração.</div>' : `<div class="rank">
        ${rank.map((p, i) => { const part = t.totalMes ? p.v / t.totalMes * 100 : 0; return `<div class="rank-item ${i === 0 && p.v > 0 ? 'first' : ''}">
          <div class="pos">${p.v > 0 ? (medal[i] || (i + 1) + 'º') : '—'}</div>
          <div><div class="nm">${esc(p.nome)}</div><div class="sm">${pct(part)}% do total da unidade · ${p.vendas} novos ativos · ${p.anuais} anuais</div>${bar(part, 'dark', 'mini')}</div>
          <div class="rv">${brl(p.v)}${f ? `<div class="sm ok">+${brl(bonusMeta(p.v, t))} bônus meta</div>` : ''}</div></div>`; }).join('')}
        <div class="rank-item" style="background:var(--soft)"><div class="pos">➕</div><div><div class="nm">Outros (líder / outros)</div><div class="sm">${pct(t.totalMes ? t.outros.v / t.totalMes * 100 : 0)}% do total · conta para a meta, mas essa fatia do bônus não é paga a ninguém</div></div><div class="rv">${brl(t.outros.v)}</div></div>
      </div>`}
    </div>`;
}

// ---------- 2. NOVOS ATIVOS ----------
function renderAtivos(t) {
  const rank = t.pessoas.map(p => ({ ...p })).sort((a, b) => b.vendas - a.vendas);

  $('ativosContent').innerHTML = `
    <div class="card">
      <h2>🆕 Novos ativos da unidade</h2>

        ${kpi('Total da unidade', t.totalVendas, 'consultoras + outros')}
        ${kpi('Consultoras', t.vendasEquipe, 'geram bônus individual')}
        ${kpi('Outros', t.outros.vendas, 'contam para a unidade')}
        ${kpi('Planos anuais', `${t.totalAnuais} <span style="font-size:.9rem;color:var(--muted)">(${pct(qual)}%)</span>`, 'dos novos + rematrículas')}
      </div>
    </div>
    <div class="grid">
      ${rank.map(p => {

          <div class="head"><div class="nome">${esc(p.nome)}</div><span class="chip ${okMin ? 'green' : 'red'}">${okMin ? '✅ ' : ''}${p.vendas}/${POL.minimoIdeal} mínimo</span></div>
          <div style="display:flex;justify-content:space-between;align-items:flex-end"><div><div class="big" style="font-size:2rem">${p.vendas}</div><div style="font-size:.78rem;color:var(--muted)">novos ativos</div></div><div style="text-align:right"><div style="font-size:1.3rem;font-weight:900" class="${b ? 'ok' : 'bad'}">${brl(b)}</div><div style="font-size:.78rem;color:var(--muted)">bônus de vendas</div></div></div>
          ${bar(p.vendas < POL.bloco ? p.vendas / POL.bloco * 100 : sobra / POL.bloco * 100, b ? 'green' : 'amber')}
          <div style="font-size:.8rem;color:var(--ink2)">🎯 ${pb.txt}</div>
          <div class="row" style="margin-top:6px"><span class="lbl">Novas vendas</span><span class="val">${p.novas}</span></div>

    </div>

      <ul class="policy">
        <li>A cada <strong>15 novos ativos</strong> (novas + rematrículas) = <strong>R$ 100</strong>. 15 → R$ 100 · 30 → R$ 200 · 45 → R$ 300.</li>
        <li>Abaixo de 15 no mês = R$ 0.</li>
        <li>Sobra de <strong>10 a 14</strong> acima de um bloco de 15 = <strong>R$ 5 por venda</strong>. Sobra de até 9 não gera excedente. Ex.: 25 = R$ 100 + 10 × R$ 5 = R$ 150.</li>
        <li>Mínimo ideal: <strong>${POL.minimoIdeal} planos/mês</strong> por consultora.</li>
      </ul>
    </details>`;
}

// ---------- 3. RETENÇÃO ----------
function renderRetencao(t) {
  const tx = t.taxaRenov, falt70 = Math.max(Math.ceil(t.renovTotal * .7) - t.renovFeitos, 0), falt85 = Math.max(Math.ceil(t.renovTotal * .85) - t.renovFeitos, 0);
  const bR = bonusRenov(t);
  const tc = t.taxaCanc, limite = Math.floor(t.ini * POL.cancLimite / 100), ideal = Math.floor(t.ini * POL.cancIdeal / 100);
  const saldo = t.atual - t.ini, compensar = Math.max(t.saidas - t.totalVendas, 0);
  const cancCls = tc == null ? 'gray' : tc <= POL.cancIdeal ? 'green' : tc <= POL.cancLimite ? 'amber' : 'red';
  $('retencaoContent').innerHTML = `
    <div class="grid-2">
      <div class="card">
        <h2>🔄 Renovações da unidade</h2>
        <div class="sub">Planos que vencem no mês × quantos já renovaram.</div>
        ${t.renovTotal ? `
        <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap">
          <div><div class="big ${tx >= 85 ? 'ok' : tx >= 70 ? 'warn' : 'bad'}">${pct(tx)}%</div><div style="font-size:.85rem;color:var(--muted)">${t.renovFeitos} de ${t.renovTotal} renovados</div></div>
          <span class="chip ${bR ? 'green' : 'red'}">${bR ? '🔓 Bônus ' + brl(bR) + ' por consultora' : '🔒 Bônus bloqueado'}</span>
        </div>
        ${bar(tx, tx >= 85 ? 'green' : tx >= 70 ? 'amber' : 'red')}
        <div class="marks"><span style="left:70%">70%</span><span style="left:85%">85%</span></div>
        <div class="row"><span class="lbl">Meta 70% → R$ ${POL.renov70} por consultora</span><span class="val ${falt70 ? '' : 'ok'}">${falt70 ? 'faltam ' + falt70 : '✅'}</span></div>
        <div class="row"><span class="lbl">Meta 85% → R$ ${POL.renov85} por consultora</span><span class="val ${falt85 ? '' : 'ok'}">${falt85 ? 'faltam ' + falt85 : '✅'}</span></div>
        <div class="row"><span class="lbl">Ainda não renovaram</span><span class="val bad">${t.naoRenovados}</span></div>` : '<div class="empty">A líder ainda não lançou as renovações previstas do mês.</div>'}
      </div>
      <div class="card">
        <h2>❌ Cancelamentos</h2>
        <div class="sub">Não gera bônus para a equipe, mas cada saída precisa ser reposta com venda.</div>
        ${t.ini ? `
        <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap">
          <div><div class="big ${cancCls === 'green' ? 'ok' : cancCls === 'amber' ? 'warn' : 'bad'}">${pct(tc)}%</div><div style="font-size:.85rem;color:var(--muted)">${t.canc} cancelamentos sobre ${t.ini} ativos</div></div>
          <span class="chip ${cancCls}">${tc <= POL.cancIdeal ? '✅ Dentro da meta' : tc <= POL.cancLimite ? '⚠️ No limite' : '🚨 Fora da meta'}</span>
        </div>
        ${bar(tc / 6 * 100, cancCls === 'green' ? 'green' : cancCls === 'amber' ? 'amber' : 'red')}
        <div class="row"><span class="lbl">Meta ideal (≤ ${POL.cancIdeal}%)</span><span class="val">até ${ideal} cancelamentos</span></div>
        <div class="row"><span class="lbl">Limite (≤ ${POL.cancLimite}%)</span><span class="val">até ${limite} cancelamentos</span></div>
        <div class="row"><span class="lbl">Margem até o limite</span><span class="val ${limite - t.canc >= 0 ? '' : 'bad'}">${limite - t.canc >= 0 ? (limite - t.canc) + ' cancelamentos' : 'estourou em ' + (t.canc - limite)}</span></div>` : '<div class="empty">A líder ainda não lançou os ativos do início do mês.</div>'}
      </div>
    </div>

    <div class="card">
      <h2>📊 Base de alunos: entra × sai</h2>
      <div class="sub">Vender é metade do jogo. Quem sai também conta — é assim que a unidade cresce ou encolhe.</div>
      ${t.ini ? `
      <div class="flow">
        <div class="step"><div class="l">Ativos dia 01</div><div class="n">${t.ini}</div></div>
        <div class="step"><div class="l">Não renovaram</div><div class="n bad">−${t.naoRenovados}</div></div>
        <div class="step"><div class="l">Cancelaram</div><div class="n bad">−${t.canc}</div></div>
        <div class="step"><div class="l">Novos ativos</div><div class="n ok">+${t.totalVendas}</div></div>
        <div class="step" style="border-color:${saldo >= 0 ? 'var(--green)' : 'var(--red)'};background:${saldo >= 0 ? 'var(--green-soft)' : 'var(--red-soft)'}"><div class="l">Ativos hoje</div><div class="n ${saldo >= 0 ? 'ok' : 'bad'}">${t.atual}</div><div style="font-size:.8rem;font-weight:700" class="${saldo >= 0 ? 'ok' : 'bad'}">${saldo >= 0 ? '+' : ''}${saldo} (${saldo >= 0 ? '+' : ''}${pct(saldo / t.ini * 100)}%)</div></div>
      </div>
      ${compensar > 0
        ? `<div class="alert red" style="margin-top:14px"><strong>🚨 Faltam ${compensar} novos ativos só para compensar as saídas.</strong> Saíram ${t.saidas} (não renovados + cancelados) e entraram ${t.totalVendas}. Cada renovação recuperada também reduz esse número.</div>`
        : `<div class="alert green" style="margin-top:14px"><strong>📈 A base está crescendo:</strong> entraram ${t.totalVendas} e saíram ${t.saidas}. Saldo de +${t.totalVendas - t.saidas} alunos.</div>`}` : '<div class="empty">Aguardando ativos do início do mês.</div>'}
    </div>`;
}

// ---------- 4. RESULTADO FOLHA ----------

    return `<div class="card person" style="border-top-color:${p.cor}">
      <div class="head"><div class="nome">${esc(p.nome)}</div></div>
      <div class="big ${tot ? 'ok' : 'bad'}" style="font-size:2rem">R$ ${fmt2(tot)}</div>
      <div style="font-size:.78rem;color:var(--muted);margin-bottom:6px">total a receber em bônus</div>
      <div class="row"><span class="lbl">Meta financeira ${f ? '(Meta ' + f + ' · ' + pct(t.totalMes ? p.v / t.totalMes * 100 : 0) + '%)' : '(não atingida)'}</span><span class="val">R$ ${fmt2(bm)}</span></div>
      <div class="row"><span class="lbl">Novos ativos (${p.vendas})</span><span class="val">${brl(bv)}</span></div>
      <div class="row"><span class="lbl">Renovação da unidade ${t.taxaRenov == null ? '' : '(' + pct(t.taxaRenov) + '%)'}</span><span class="val">${brl(bR)}</span></div>
      <div class="row"><span class="lbl">Avaliações (${p.aval} × R$ ${POL.aval})</span><span class="val">${brl(ba)}</span></div>
      <div class="row"><span class="lbl">Crédito produtos (1%) — fora da folha</span><span class="val" style="color:var(--muted)">R$ ${fmt2(p.prod * POL.credito)}</span></div>
    </div>`;
  }).join('');
  $('folhaContent').innerHTML = `
    <div class="card">
      <h2>💰 Resultado da folha — consultoras</h2>
      <div class="sub">Quanto cada vendedora já garantiu de bônus até a última apuração. "Outros" não entra aqui: soma no resultado da unidade e da líder.</div>
      <div class="grid">${kpi('Total folha das consultoras', 'R$ ' + fmt2(geral), '', 'ok')}${kpi('Faixa da meta', f ? 'Meta ' + f : 'Nenhuma', f ? 'bônus de ' + brl(POL.bonusMeta[f - 1]) + ' dividido' : 'sem bônus de meta ainda')}${kpi('Bônus renovação', brl(bR), 'para cada consultora')}</div>

    <div class="grid">${cards}</div>
    <details class="pol"><summary>📋 Política de bonificação — consultoras</summary>
      <ul class="policy">
        <li><strong>Meta financeira:</strong> Meta 1 → R$ 400 · Meta 2 → R$ 700 · Meta 3 → R$ 1.000, rateados pela participação de cada consultora no total vendido pela unidade (ex.: fez 50% do total → recebe 50% do bônus). A fatia de Outros não gera bônus individual.</li>
        <li><strong>Novos ativos:</strong> R$ 100 a cada 15 (novas + rematrículas). Sobra de 10 a 14 acima de um bloco = R$ 5 por venda. Abaixo de 15 = R$ 0.</li>
        <li><strong>Renovação:</strong> taxa da unidade ≥ 70% → R$ 50 · ≥ 85% → R$ 100 para cada consultora.</li>
        <li><strong>Avaliações:</strong> R$ 10 por avaliação vendida.</li>
        <li><strong>Produtos:</strong> 1% vira crédito de consumo no sistema (não entra na folha).</li>
      </ul>
    </details>`;
}

// ---------- 6. LÍDER (restrito, bônus calculado no servidor) ----------

// ---------- 7. PREENCHER + HISTÓRICO (restrito) ----------
const moneyIn = (id, v) => `<input type="text" inputmode="decimal" class="money" id="${id}" value="${fmt2(v)}">`;
const intIn = (id, v) => `<input type="number" min="0" id="${id}" value="${Math.round(v)}">`;
function renderPreencher() {
  if (!isUnlocked) return;
  const L = records[0] || {};
  const p = currentMonth.split('/'), idx = ABREV.indexOf(p[0]), ano = +p[1];
  const min = iso(new Date(ano, idx, 1)), max = iso(new Date(ano, idx + 1, 0)), hj = iso(new Date());
  const linha = (rot, f) => `<tr><td>${rot}</td><td>${moneyIn(f[0], num(L[f[0]]))}</td><td>${intIn(f[1], num(L[f[1]]))}</td><td>${intIn(f[2], num(L[f[2]]))}</td><td>${intIn(f[3], num(L[f[3]]))}</td><td>${intIn(f[4], num(L[f[4]]))}</td><td>${moneyIn(f[5], num(L[f[5]]))}</td></tr>`;
  $('preencherContent').innerHTML = `
    <div id="preencherMsg"></div>
    <div class="card">
      <h2>✏️ Nova apuração — ${esc(rotulo(currentMonth))}</h2>
      <div class="sub">Os campos já vêm com a última apuração. Altere só o que mudou — os valores são <strong>acumulados do mês</strong> (estava R$ 30.000 e hoje vendeu R$ 3.500 → digite 33.500).</div>
      <div class="form-grid">
        <div class="field"><label for="fill_nome">Quem está registrando</label><input id="fill_nome" maxlength="60" value="${esc(L.nome || '')}" placeholder="Seu nome"></div>
        <div class="field"><label for="fill_data">Data da apuração</label><input type="date" id="fill_data" min="${min}" max="${max}" value="${hj >= min && hj <= max ? hj : max}"></div>
      </div>
      <div class="section-title">Vendas e novos ativos por pessoa</div>
      <div class="table-wrap"><table class="fill-table">
        <tr><th></th><th>Vendas pagas (R$)</th><th>Novas</th><th>Rematrículas</th><th>Anuais</th><th>Avaliações</th><th>Produtos (R$)</th></tr>
        ${SLOTS.map(c => linha(esc(c.nome), ['c' + c.k + '_v', 'c' + c.k + '_novas', 'c' + c.k + '_remat', 'c' + c.k + '_p', 'c' + c.k + '_aval', 'c' + c.k + '_prod'])).join('')}
        ${linha('Outros', ['ov', 'o_novas', 'o_remat', 'op', 'o_aval', 'ou_prod'])}
      </table></div>
      <div style="font-size:.76rem;color:var(--muted);margin-top:6px">Vendas pagas, sem saldo devedor. "Anuais" = quantos dos planos vendidos são anuais. No celular, deslize a tabela para o lado.</div>
      <div class="section-title">Retenção</div>
      <div class="form-grid">
        <div class="field"><label for="ativos_inicio">Ativos no dia 01 (fixo no mês)</label>${intIn('ativos_inicio', num(L.ativos_inicio))}</div>
        <div class="field"><label for="renovTotal">Renovações previstas (fixo no mês)</label>${intIn('renovTotal', num(L.renovTotal))}</div>
        <div class="field"><label for="renovFeitos">Renovações feitas (acumulado)</label>${intIn('renovFeitos', num(L.renovFeitos))}</div>
        <div class="field"><label for="renovAnuais">Renovações em plano anual (acumulado)</label>${intIn('renovAnuais', num(L.renovAnuais))}</div>
        <div class="field"><label for="cancelamentos">Cancelamentos (acumulado)</label>${intIn('cancelamentos', num(L.cancelamentos))}</div>
      </div>
      <button class="btn btn-dark" id="btnSalvar" onclick="saveData()" style="margin-top:10px">💾 Salvar apuração</button>
    </div>
    <div class="card">
      <h2>📜 Histórico de apurações</h2>
      <div class="sub">Cada linha é uma apuração (valores acumulados até aquele dia). O painel usa sempre a de data mais recente. <strong>Dados de</strong> = dia a que os números se referem · <strong>Lançado em</strong> = momento real em que a líder salvou (registrado automaticamente, não pode ser alterado).</div>
      ${(() => { const ult = records.map(r => dBR(r.lancado_em)).filter(Boolean).sort((a, b) => b - a)[0]; if (!ult) return ''; const hoje = new Date(); hoje.setHours(0, 0, 0, 0); const n = Math.round((hoje - ult) / 864e5);
        return `<div class="alert ${n >= 2 ? 'amber' : 'green'}" style="margin:8px 0">${n <= 0 ? '✅ Último lançamento feito hoje.' : n === 1 ? '🕒 Último lançamento foi ontem.' : '⚠️ ' + n + ' dias sem lançamento.'}</div>`; })()}
      ${records.length ? `<div class="table-wrap"><table>
        <tr><th>Dados de</th><th>Lançado em</th><th>Quem</th>${SLOTS.map(c => `<th>${esc(c.nome)}</th>`).join('')}<th>Outros</th><th>Total</th><th>Novos ativos</th><th>Renov.</th><th>Canc.</th></tr>
        ${records.map(r => { let nv = num(r.o_novas) + num(r.o_remat); for (let k = 1; k <= 6; k++) nv += num(r['c' + k + '_novas']) + num(r['c' + k + '_remat']);
          return `<tr><td>${esc(r.data || '—')}</td><td style="white-space:nowrap">${esc(lancTxt(r) || '—')}${atrasoChip(r)}</td><td>${esc(r.nome || '—')}</td>${SLOTS.map(c => `<td>${brl(num(r['c' + c.k + '_v']))}</td>`).join('')}<td>${brl(num(r.ov))}</td><td><strong>${brl(num(r.total))}</strong></td><td>${nv}</td><td>${fmt(num(r.renovFeitos))}/${fmt(num(r.renovTotal))}</td><td>${fmt(num(r.cancelamentos))}</td></tr>`; }).join('')}
      </table></div>` : '<div class="empty">Nenhuma apuração neste mês ainda.</div>'}
    </div>`;
  document.querySelectorAll('#preencherContent input.money').forEach(i => {
    i.addEventListener('focus', () => { if (num(i.value) === 0) i.value = ''; setTimeout(() => i.select(), 0); });
    i.addEventListener('blur', () => { i.value = fmt2(num(i.value)); });
  });
}
async function saveData() {
  const msg = $('preencherMsg'), nome = $('fill_nome').value.trim(), dIso = $('fill_data').value;
  if (!nome) { msg.innerHTML = '<div class="alert red">Digite o nome de quem está registrando.</div>'; return; }
  if (!dIso || dIso < $('fill_data').min || dIso > $('fill_data').max) { msg.innerHTML = '<div class="alert red">Escolha uma data dentro de ' + esc(rotulo(currentMonth)) + '.</div>'; return; }
  const [y, m, d] = dIso.split('-'), val = id => Math.max(num(($(id) || {}).value), 0);
  const dados = { nome, data: d + '/' + m + '/' + y, hora: new Date().toTimeString().slice(0, 5) };
  ['ov', 'o_novas', 'o_remat', 'op', 'o_aval', 'ou_prod', 'renovTotal', 'renovFeitos', 'renovAnuais', 'ativos_inicio', 'cancelamentos'].forEach(f => dados[f] = val(f));
  SLOTS.forEach(c => { ['v', 'novas', 'remat', 'p', 'aval', 'prod'].forEach(f => dados['c' + c.k + '_' + f] = val('c' + c.k + '_' + f)); dados['c' + c.k + '_nome'] = c.nome; });
  const b = $('btnSalvar'); b.disabled = true; b.textContent = 'Salvando...';
  try {
    const r = await apiPost({ action: 'salvar', senha: senhaLider, dados });
    if (r && r.ok) { toast('✅ Apuração salva · ' + dados.data); await loadMonth(); window.scrollTo({ top: 0 }); $('preencherMsg').innerHTML = '<div class="alert green">✅ Apuração de ' + esc(dados.data) + ' salva com sucesso! O painel já foi atualizado.</div>'; return; }
    msg.innerHTML = '<div class="alert red">⚠️ ' + esc((r && r.msg) || 'Erro ao salvar.') + '</div>';
    if (r && r.erro === 'senha') setUnlocked(false);
  } catch (e) { msg.innerHTML = '<div class="alert red">Erro de conexão: ' + esc(e.message) + '</div>'; }
  const b2 = $('btnSalvar'); if (b2) { b2.disabled = false; b2.textContent = '💾 Salvar apuração'; }
}

// ==================== CONFETE ====================
function confetti() {
  const c = $('confetti'), ctx = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cores = ['#111827', '#16a34a', '#f59e0b', '#2563eb', '#dc2626', '#7c3aed'];
  const ps = Array.from({ length: 160 }, () => ({ x: Math.random() * c.width, y: -Math.random() * c.height, w: 6 + Math.random() * 6, h: 3 + Math.random() * 4, cor: cores[Math.random() * cores.length | 0], vy: 2 + Math.random() * 3, vx: Math.random() * 2 - 1, r: Math.random() * 360, vr: Math.random() * 6 - 3 }));
  let f = 0;
  (function loop() { ctx.clearRect(0, 0, c.width, c.height); ps.forEach(p => { p.y += p.vy; p.x += p.vx; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r * Math.PI / 180); ctx.fillStyle = p.cor; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }); if (++f < 200) requestAnimationFrame(loop); else ctx.clearRect(0, 0, c.width, c.height); })();
}

init();
</script>
